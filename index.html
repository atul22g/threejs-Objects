<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive 3D geometry explorer built with Three.js. Manipulate shapes, materials, and scene properties in real-time." />
  <meta name="theme-color" content="#000000" />

  <!-- Open Graph -->
  <meta property="og:title" content="Three.js 3D Objects Explorer" />
  <meta property="og:description" content="Interactive 3D geometry explorer built with Three.js." />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Three.js 3D Objects Explorer" />
  <meta name="twitter:description" content="Interactive 3D geometry explorer built with Three.js." />

  <title>Three.js 3D Objects Explorer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050510;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Subtle loading indicator */
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.3);
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 1;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="loading">Loading 3D Scene…</div>
  <canvas></canvas>

  <script type="module" src="main.js"></script>
</body>
</html>
